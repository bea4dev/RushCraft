intro1 = "クラシックな鉄剣には攻撃のクールダウンがない。ためずに好きなだけ連打できる"
intro2 = "敵に近づいて、左クリックで攻撃しよう"
demo = "お手本: 連打で一気に倒す"
demo-label = "連打！"
practice1 = "敵を倒そう"
practice2 = "反撃してくる敵を倒そう"

[tutorial.bow]
subtitle = "遠くの敵を狙い撃つ"
intro1 = "右クリック長押しで弓を引き、離すと矢を放つ。しっかり引き絞るほど遠くまで強く飛ぶ"
intro2 = "矢は少しずつ落ちていくので、遠くの敵は少し上を狙おう"
demo = "お手本: 台の上の敵を狙い撃つ"
demo-label = "狙い撃ち！"
practice1 = "台の上の敵を射抜こう"
practice2 = "動く敵を射抜こう (少し先を狙う)"

[tutorial.shield]
subtitle = "全てを弾き返す"
intro1 = "盾はオフハンドに持つ。右クリック長押しで構えると、正面からの攻撃を防げる"
guard = "盾を構えて矢を防ごう"
guard-hint = "構えている間はゲージが減り、空になると壊れる (使わずにいると回復する)"
parry-title = "パリィ"
parry-subtitle = "構えを解いた瞬間に弾き返す"
parry-intro = "盾は構えを解いた瞬間が「パリィ」。タイミングが合えば近接攻撃も飛び道具も弾き返せる！"
demo-projectile = "お手本: 矢が当たる直前に構えを解いてパリィ"
demo-projectile-label = "構えを解いた瞬間にパリィ！"
parry-projectile = "飛んでくる矢をパリィしよう"
parry-projectile-hint = "盾を構えておき、矢が目の前に来たら右クリックを離す。敵が弓を引いたら合図！"
demo-melee = "お手本: 殴られる瞬間にパリィ"
demo-melee-label = "近接攻撃もパリィ！"
demo-stun-label = "ふっとんでスタン！"
parry-melee = "敵の近接攻撃をパリィしよう"
parry-melee-hint = "敵の頭に怒りマークが出たら攻撃の合図。構えておき、殴られる瞬間に右クリックを離そう (殴られてすぐ離してもパリィになる)"
parry-knife = "投げナイフをパリィしよう (当たると即死！)"
parry-knife-hint = "投げナイフも TNT もスワッパーも、パリィで弾き返せる。合図を見て構えを解こう"
finish = "パリィに成功すると盾の耐久が全回復する。外すと 0.8 秒はパリィできないので、むやみに連打しないように"
finish-bar = "全てを弾き返せ！"

[tutorial.swapper]
subtitle = "当てた敵と入れ替わる"
intro1 = "スワッパーは右クリック長押しで構えて、離すと投げる。当たった敵にダメージを与えて、位置を入れ替える"
intro2 = "投げたスワッパーは手元に戻ってくる (奈落に落ちても戻ってくる)"
demo = "お手本: 島にいる敵と入れ替わる"
demo-label = "入れ替わり！"
practice1 = "島の敵にスワッパーを当てて、島へ渡ろう"
practice2 = "もう一度入れ替わって、元の場所に戻ろう"
practice2-hint = "スワッパーはもう手元に戻っているはず。敵を狙って投げよう"

[tutorial.knife]
subtitle = "一撃必殺"
intro1 = "投げナイフは右クリックで投げる。当たった敵を一撃で倒す！"
intro2 = "試合ではスポーンごとに 1 本で、投げてから 30 秒で復活する (ここではすぐ復活する)"
demo = "お手本: 一撃で倒す"
demo-label = "一撃！"
practice1 = "投げナイフで敵を倒そう"
practice2 = "動く敵を投げナイフで倒そう"
practice2-hint = "ナイフは少しずつ落ちていく。動く敵は少し先を狙おう"
finish = "盾を構えた敵には防がれ、パリィされると跳ね返される。相手の盾に注意しよう"

[tutorial.tnt]
subtitle = "くっつけて爆破"
intro1 = "クリックで着火して構え、もう一度クリックで投げる。投げた TNT は近くの敵にくっつく"
intro2 = "爆発すると、持っている敵と周り 2.5 ブロックの敵を倒す。爆発までの時間はランダムで、音がだんだん速くなる"
intro3 = "誰にも当たらなければ手元に戻ってきて、時間切れなら自分が爆発する！"
demo = "お手本: 敵にくっつけて爆破"
demo-label = "くっつけろ！"
practice1 = "TNT を敵にくっつけて倒そう"
practice1-hint = "外すと戻ってくるので、爆発する前にもう一度投げよう"
practice2 = "押し付けられた TNT を投げ返そう"
practice2-hint = "TNT を持たされても、爆発する前にクリックすれば投げ返せる。敵を狙って投げよう！"

[tutorial.wall]
subtitle = "一瞬で壁を作る"
intro1 = "即席壁はブロックを右クリックすると、そこに幅 5・高さ 3 のガラスの壁を作る。壁は自分の向きと直交する向きにできる"
intro2 = "使ってから 15 秒で復活する (ここではすぐ復活する)"
demo = "お手本: 壁で矢を防ぐ"
demo-label = "矢を防ぐ！"
practice1 = "壁を作って矢を防ごう"
practice1-hint = "敵の方を向いて、目の前の床を右クリック"
practice2 = "壁で敵を打ち上げよう"
practice2-hint = "壁ができる場所にいる敵は上に打ち上げられる。敵の足元の床を右クリックしよう"

[tutorial.mace]
subtitle = "跳んで、叩きつける"
intro1 = "メイスを持ってしゃがむとチャージ。チャージが終わって音が鳴ったら、しゃがみを解除すると前方へ高く飛び上がる"
intro2 = "高く跳ぶと、落ちる途中で一気に加速する。落下ダメージには注意！ (チャージ中にダメージを受けると解除される)"
demo = "お手本: 飛び上がって敵に叩きつける"
demo-label = "叩きつけ！"
practice1 = "大ジャンプで高台に飛び乗ろう"
practice1-hint = "しゃがんでゲージが溜まるのを待ち、高台の方を向いてしゃがみを解除"
practice2 = "高い所から落ちながら敵を叩こう"
practice2-hint = "落ちながらメイスで攻撃すると大ダメージ (当てれば落下ダメージも受けない)。高台から飛び降りて敵を狙おう"

[tutorial.spear]
subtitle = "突進して突き刺す"
intro1 = "槍で攻撃すると、突進のエンチャントで前方へ飛び込む。その後 0.8 秒間は周りの敵にも攻撃が当たる"
intro2 = "3 回使うと壊れて、時間で復活する (ここではすぐ復活する)"
demo = "お手本: 突進で離れた敵を突く"
demo-label = "突進！"
practice1 = "突進して敵を倒そう"
practice1-hint = "敵の方を向いて左クリック。少し離れていても飛び込んで届く"
practice2 = "動く敵を突進で倒そう"
practice2-hint = "飛び込んだ後も少しの間は周りに当たる。敵の進む先に飛び込もう"

[tutorial.trap]
subtitle = "踏んだら爆発"
intro1 = "トラップは置いた感圧板を敵が踏むと爆発し、周り 2.5 ブロックの敵を倒す"
intro2 = "自分や味方が踏んでも何も起きない。置けるのは 10 個までで、11 個目を置くと最初に置いたものから爆発する"
demo = "お手本: 敵の通り道に仕掛ける"
demo-path-label = "敵の通り道"
practice1 = "敵の通り道にトラップを仕掛けよう"
practice1-hint = "敵が歩く道の床に感圧板を置こう。マップに馴染む見た目なので気付かれにくい"
practice2 = "自分のトラップを踏んでみよう"
practice2-hint = "自分や味方が踏んでも爆発しない。安心して踏んでみよう"
