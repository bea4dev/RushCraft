classic_sword-description = "An iron sword without attack cooldown"
classic_bow = "Classic Bow"
classic_bow-description = "A bow with Power I (comes with 32 arrows)"
shield = "Shield"
shield-description = "Guarding wears it down and it breaks in about 5 seconds (it recovers 10 seconds after last use, and comes back 10 seconds after breaking). Right after lowering it you can parry: melee attackers are knocked away and stunned, and everything thrown at you is reflected. A successful parry fully repairs it"
