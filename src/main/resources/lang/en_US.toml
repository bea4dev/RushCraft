swapper-description = "Throw it to damage an enemy and swap places with them. It returns to you after being thrown"
throwing_knife = "Throwing Knife"
throwing_knife-description = "Right-click to throw. Takes down an enemy in one hit. Comes back 30 seconds after throwing"
tnt = "Sticky TNT"
tnt-description = "Click (left or right) to light it and hold it up, then click again to throw. The TNT sticks to a nearby enemy and, when it explodes, takes down the holder and enemies within 2.5 blocks. The enemy can throw it back while there is time left. If it hits no one, it comes back to you before exploding (the fuse time is random). Comes back 15 seconds after exploding"
instant_wall = "Instant Wall"
instant_wall-description = "Right-click a block to raise a 5-wide, 3-high glass wall across your view. Players where the wall rises are launched upward. Comes back 15 seconds after use"
mace = "Mace"
mace-description = "Sneak while holding it to charge, then stop sneaking once charged to leap forward and high into the air. Watch out for fall damage"
spear = "Spear"
spear-description = "An iron spear with Lunge II. Attacking lunges you forward, and for 0.8 seconds afterwards enemies around you are hit too. Breaks after 3 uses and comes back after 20 seconds"
trap = "Trap"
trap-description = "A pressure plate that explodes when an enemy steps on it, taking down enemies within 2.5 blocks. Nothing happens when you or your teammates step on it. You get 10 per spawn and can have up to 10 placed; placing an 11th sets off your oldest one. A broken trap drops nothing"

